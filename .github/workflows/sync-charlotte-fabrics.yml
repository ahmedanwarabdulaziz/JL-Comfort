name: Sync Charlotte Fabrics catalog

on:
  workflow_dispatch:
    inputs:
      facet_groups:
        description: 'Which facets to sync this run (split into phases to keep runs short)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - color
          - pattern
          - material
      dry_run:
        description: 'Only report what a sync would add and remove (writes nothing)'
        required: false
        default: false
        type: boolean
      allow_large_removal:
        description: 'Let this run retire more than 5% of fabrics (check a dry run first)'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Charlotte Fabrics sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_SYNC_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CF_SYNC_ALLOW_LARGE_REMOVAL: ${{ inputs.allow_large_removal && '1' || '' }}
          CF_SYNC_FACET_GROUPS: ${{ inputs.facet_groups == 'all' && 'color,pattern,material' || inputs.facet_groups }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_S3_API_URL: ${{ secrets.CLOUDFLARE_R2_S3_API_URL }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/sync-charlotte-fabrics.js
